services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fund
      POSTGRES_PASSWORD: fund_password
      POSTGRES_DB: fund
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fund:fund_password@postgres:5432/fund
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DATA_PROVIDER_ORDER: ${DATA_PROVIDER_ORDER:-eastmoney,mock}
      ENABLE_AUTO_SYNC: "true"
      SEED_DEMO_DATA: "true"
      DEMO_USERNAME: demo
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo123456}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      MODEL_JOBS: ${MODEL_JOBS:--1}
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
  backend_storage:
  backend_logs:
